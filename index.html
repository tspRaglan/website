<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>raglan.au</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ── FULL SCREEN CLICK TARGET ── */
        #start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* Safe area padding so content clears notches / home indicator */
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* ── LOGO ── */
        #logo-container {
            /* Scales elegantly across all devices:
               - Desktop: up to 500px
               - Mobile portrait: 80% of the narrower dimension
               - Mobile landscape: 80% of the shorter (height) dimension */
            width: min(500px, 80vmin);
            height: min(500px, 80vmin);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #raglan-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: pulse 4s infinite ease-in-out, glowCycle 8s infinite linear;
        }

        @keyframes pulse {
            0%,
            100% { transform: scale(1.0); }
            50%   { transform: scale(1.06); }
        }

        @keyframes glowCycle {
            0%   { filter: sepia(1) saturate(20) hue-rotate(0deg)   drop-shadow(0 0 15px #00f2ff); }
            33%  { filter: sepia(1) saturate(20) hue-rotate(90deg)  drop-shadow(0 0 20px #7000ff); }
            66%  { filter: sepia(1) saturate(20) hue-rotate(240deg) drop-shadow(0 0 25px #ff00c8); }
            100% { filter: sepia(1) saturate(20) hue-rotate(360deg) drop-shadow(0 0 15px #00f2ff); }
        }



        /* ── PLAYING STATE — subtle logo pulse speeds up ── */
        #raglan-logo.playing {
            animation: pulse 2.5s infinite ease-in-out, glowCycle 8s infinite linear;
        }
    </style>
</head>

<body>

    <div id="start-screen" onclick="startExperience()">
        <div id="logo-container">
            <img src="assets/RaglanLogoTransparentWhite.png" id="raglan-logo" alt="raglan">
        </div>
    </div>

    <!-- Background audio — src set by JS below for easy swapping between local/R2 -->
    <audio id="bg-audio" loop preload="auto"></audio>

    <script>
        // ── CONFIG ──────────────────────────────────────────────────────────
        // Switch between local test file and R2 URL here when ready to go live
        const AUDIO_SRC_LOCAL = 'EndMusic.mp3';
        const AUDIO_SRC_R2    = ''; // set to 'https://pub-3ed2bcf66a6d49cf88d8802c420af955.r2.dev/EndMusic.mp3' when uploaded to R2

        const AUDIO_SRC = AUDIO_SRC_R2 || AUDIO_SRC_LOCAL;
        const AUDIO_VOLUME = 0.85; // 0.0 – 1.0
        // ────────────────────────────────────────────────────────────────────

        const audio   = document.getElementById('bg-audio');
        const logo    = document.getElementById('raglan-logo');
        let   started = false;

        audio.src    = AUDIO_SRC;
        audio.volume = AUDIO_VOLUME;

        // Attempt silent unmuted autoplay on load
        window.addEventListener('load', () => {
            audio.play().then(() => {
                started = true;
                logo.classList.add('playing');
            }).catch(() => {
                // Autoplay blocked by browser policy — waiting for tap on Raglan man
            });
        });

        // Tap the Raglan man to start (or toggle play/pause)
        function startExperience() {
            if (!started) {
                audio.play().then(() => {
                    started = true;
                    logo.classList.add('playing');
                }).catch(e => {
                    console.warn('Playback failed:', e);
                });
            } else {
                if (audio.paused) {
                    audio.play();
                    logo.classList.add('playing');
                } else {
                    audio.pause();
                    logo.classList.remove('playing');
                }
            }
        }
    </script>

</body>

</html>
